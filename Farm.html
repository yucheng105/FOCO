<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCO - Farm</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --farm-bg: linear-gradient(to bottom, #74b9ff, #55efc4);
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background: var(--farm-bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂部身分資訊 [cite: 30, 31, 32, 33] */
        .header {
            padding: 20px;
            background: white;
            border-radius: 0 0 20px 20px;
        }

        .user-meta { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .xp-bar { height: 10px; background: #dfe6e9; border-radius: 5px; overflow: hidden; }
        .xp-fill { height: 100%; background: var(--primary-color); width: 65%; }

        /* 寵物顯示區 [cite: 35] */
        .pet-stage {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .pet-character {
            font-size: 6rem;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .pet-character.eating { transform: scale(1.3) rotate(10deg); }

        /* 背包區域  */
        .backpack-panel {
            background: var(--card-bg);
            border-radius: 25px 25px 0 0;
            padding: 20px;
            max-height: 40%;
        }

        .backpack-title { font-weight: bold; margin-bottom: 15px; display: block; }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .reward-item {
            aspect-ratio: 1;
            background: white;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            position: relative;
            cursor: pointer;
        }

        .item-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--primary-color);
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-meta">
            <strong>使用者名稱</strong>
            <span>🏆 專業專注者</span>
        </div>
        <div class="xp-bar"><div class="xp-fill"></div></div>
        <small style="display: block; text-align: right; margin-top: 5px;">Lv. 12</small>
    </div>

    <div class="pet-stage">
        <div class="pet-character" id="main-pet">🐱</div>
        <div id="float-msg" style="position: absolute; top: 20%; background: white; padding: 5px 10px; border-radius: 10px; display: none;">好餓喔...</div>
    </div>

    <div class="backpack-panel">
        <span class="backpack-title">我的背包 (Backpack)</span>
        <div class="item-grid">
            <div class="reward-item" onclick="feedPet('🐟')">
                <span>🐟</span>
                <span class="item-count">x5</span>
            </div>
            <div class="reward-item" onclick="feedPet('🧶')">
                <span>🧶</span>
                <span class="item-count">x2</span>
            </div>
            <div class="reward-item" style="opacity: 0.5;">
                <span>🔒</span>
            </div>
            <div class="reward-item" style="opacity: 0.5;">
                <span>🔒</span>
            </div>
        </div>
    </div>

    <script>
        function feedPet(item) {
            const pet = document.getElementById('main-pet');
            // 觸發餵食動畫
            pet.classList.add('eating');
            setTimeout(() => {
                pet.classList.remove('eating');
                alert(`寵物吃了 ${item}，心情變好了！經驗值 +10`);
                // 這裡實作 XP 條更新邏輯
            }, 500);
        }

        // 模擬寵物隨機對話 (成就變化提示)
        setInterval(() => {
            const msg = document.getElementById('float-msg');
            const lines = ["你今天超棒！", "我想念專注的你了", "快去工作拿小魚干！"];
            msg.innerText = lines[Math.floor(Math.random() * lines.length)];
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }, 8000);
    </script>
</body>
</html>
