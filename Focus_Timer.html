<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCO - Timer</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #2d3436; /* 專注時建議深色模式減少干擾 */
            --text-color: #dfe6e9;
        }

        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            justify-content: space-between;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .menu-btn { align-self: flex-start; font-size: 1.5rem; cursor: pointer; }

        /* 計時器容器 */
        .timer-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG 圓環 */
        svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .circle-bg { stroke: #636e72; }
        .circle-progress {
            stroke: var(--primary-color);
            stroke-dasharray: 880; /* 2 * PI * r (r=140) */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        /* 寵物與數字中心區 */
        .timer-content {
            position: absolute;
            text-align: center;
        }

        .pet-display {
            font-size: 4rem;
            margin-bottom: 10px;
            /* 這裡未來可放置 的 Video 或 Gif */
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        /* 暫停按鈕 */
        .btn-pause {
            width: 80%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid white;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-pause:active { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body>

    <div class="menu-btn">☰</div>

    <div class="timer-container">
        <svg>
            <circle class="circle-bg" cx="150" cy="150" r="140"></circle>
            <circle id="progress" class="circle-progress" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="timer-content">
            <div class="pet-display" id="pet">🐱</div>
            <div class="time-display" id="timer-text">25:00</div>
        </div>
    </div>

    <button class="btn-pause" id="pause-btn" onclick="toggleTimer()">暫停</button>

    <script>
        let timeLeft = 25 * 60; // 暫定 25 分鐘
        let totalTime = 25 * 60;
        let isRunning = true;
        let timerInterval;

        const timerText = document.getElementById('timer-text');
        const progressCircle = document.getElementById('progress');
        const pet = document.getElementById('pet');
        const pauseBtn = document.getElementById('pause-btn');

        function updateTimer() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerText.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            // 更新圓環進度 
            const offset = (timeLeft / totalTime) * 880;
            progressCircle.style.strokeDashoffset = 880 - offset;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishFocus();
            }
            timeLeft--;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                pauseBtn.innerText = "繼續";
                pet.innerText = "💤"; // 暫停時寵物睡覺
            } else {
                startInterval();
                pauseBtn.innerText = "暫停";
                pet.innerText = "🐱";
            }
            isRunning = !isRunning;
        }

        function startInterval() {
            timerInterval = setInterval(updateTimer, 1000);
        }

        function finishFocus() {
            alert("專注結束！辛苦了。");
            // 接下來導向「微反思表單」
            // window.location.href = 'reflection.html';
        }

        // 初始化
        startInterval();
    </script>
</body>
</html>
