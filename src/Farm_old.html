<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCO - Farm</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-gradient: linear-gradient(to bottom, #e1f5fe, #e8f5e9);
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --drawer-width: 250px;
        }

        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Hamburger Menu Style --- */
        .side-menu {
            position: fixed;
            top: 0;
            left: calc(-1 * var(--drawer-width));
            width: var(--drawer-width);
            height: 100%;
            background: var(--card-bg);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding-top: 60px;
        }

        .side-menu.active {
            left: 0;
        }

        .menu-item {
            padding: 15px 25px;
            font-size: 1.1rem;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-item:hover {
            background: #f1f2f6;
            color: var(--primary-color);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* --- Farm UI Elements --- */
        .nav-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            z-index: 100;
        }

        .menu-icon { font-size: 1.5rem; cursor: pointer; margin-right: 15px; }

        .user-header {
            padding: 0 20px;
            margin-bottom: 20px;
        }

        .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .rank-badge { background: #f1c40f; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; color: white; font-weight: bold; }
        .petname { font-weight: bold; font-size: 1.2rem; }

        .xp-bar-bg { height: 10px; background: rgba(0,0,0,0.1); border-radius: 5px; overflow: hidden; }
        .xp-bar-fill { height: 100%; background: var(--primary-color); width: 45%; }

        /* Pet Area */
        .pet-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .pet-display {
            font-size: 6rem;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Backpack / Inventory Area */
        .inventory-section {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px 30px 0 0;
            padding: 20px;
            min-height: 200px;
        }

        .inventory-title { font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .reward-item {
            aspect-ratio: 1/1;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .reward-item.empty { background: rgba(255, 255, 255, 0.4); border: 1px dashed #ccc; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="side-menu" id="side-menu">
        <a href="Home_Page.html" class="menu-item">🏠 首頁</a>
        <a href="Farm.html" class="menu-item" style="background: #f1f2f6; color: var(--primary-color);">🌾 農場</a>
        <a href="Stats.html" class="menu-item">📊 統計</a>
        <a href="Mission_List.html" class="menu-item">📋 任務列表</a>
    </nav>

    <div class="nav-bar">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <span style="font-weight: bold;">我的農場</span>
    </div>

    <div class="user-header">
        <div class="user-row">
            <span class="rank-badge">GOLD</span>
            <span class="petname">小橘子</span>
        </div>
        <div class="xp-bar-bg">
            <div class="xp-bar-fill"></div>
        </div>
        <p style="font-size: 0.7rem; color: #636e72; margin-top: 5px;">Level 10 (450/1000 XP)</p>
    </div>

    <div class="pet-container">
        <div class="pet-display">🐱</div>
    </div>

    <div class="inventory-section">
        <div class="inventory-title">🎒 背包物品</div>
        <div class="grid-container">
            <div class="reward-item" onclick="useItem('🐟')">🐟</div>
            <div class="reward-item" onclick="useItem('🧶')">🧶</div>
            <div class="reward-item" onclick="useItem('🍖')">🍖</div>
            <div class="reward-item empty"></div>
            <div class="reward-item empty"></div>
            <div class="reward-item empty"></div>
            <div class="reward-item empty"></div>
            <div class="reward-item empty"></div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('overlay');
            menu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function useItem(item) {
            alert('使用了 ' + item + '！寵物感到非常開心。');
        }
    </script>
</body>
</html>
