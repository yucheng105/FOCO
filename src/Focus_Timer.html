<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCO - Timer</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #2d3436; /* 專注時建議深色模式減少干擾 */
            --text-color: #dfe6e9;
            --drawer-width: 250px;
            --card-bg: #353b48;
        }

        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            justify-content: space-between;
            padding: 20px 20px 40px 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* --- Hamburger Menu Style --- */
        .side-menu {
            position: fixed;
            top: 0;
            left: calc(-1 * var(--drawer-width));
            width: var(--drawer-width);
            height: 100%;
            background: var(--card-bg);
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding-top: 60px;
        }

        .side-menu.active {
            left: 0;
        }

        .menu-item {
            padding: 15px 25px;
            font-size: 1.1rem;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* --- 原有內容佈局 --- */
        .nav-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            z-index: 100;
        }

        .menu-btn { font-size: 1.8rem; cursor: pointer; padding: 10px; }

        .timer-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .circle-bg { stroke: #636e72; }
        .circle-progress {
            stroke: var(--primary-color);
            stroke-dasharray: 880;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-content {
            position: absolute;
            text-align: center;
        }

        .pet-display {
            font-size: 4.5rem;
            margin-bottom: 10px;
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        /* 按鈕區 */
        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-action {
            width: 85%;
            max-width: 300px;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn-pause {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid white;
        }

        .btn-finish {
            background: var(--primary-color);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .btn-action:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="side-menu" id="side-menu">
        <a href="Home_Page.html" class="menu-item">🏠 首頁</a>
        <a href="Farm.html" class="menu-item">🌾 農場</a>
        <a href="Stats.html" class="menu-item">📊 統計</a>
        <a href="Mission_List.html" class="menu-item">📋 任務列表</a>
    </nav>

    <div class="nav-bar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </div>

    <div class="timer-container">
        <svg>
            <circle class="circle-bg" cx="150" cy="150" r="140"></circle>
            <circle id="progress" class="circle-progress" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="timer-content">
            <div class="pet-display" id="pet">🐱</div>
            <div class="time-display" id="timer-text">25:00</div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn-action btn-pause" id="pause-btn" onclick="toggleTimer()">暫停</button>
        <button class="btn-action btn-finish" onclick="location.href='Rewards.html'">結束</button>
    </div>

    <script>
        let timeLeft = 25 * 60; 
        let totalTime = 25 * 60;
        let isRunning = true;
        let timerInterval;

        const timerText = document.getElementById('timer-text');
        const progressCircle = document.getElementById('progress');
        const pet = document.getElementById('pet');
        const pauseBtn = document.getElementById('pause-btn');

        // 選單邏輯
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('overlay');
            menu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function updateTimer() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerText.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            const offset = (timeLeft / totalTime) * 880;
            progressCircle.style.strokeDashoffset = 880 - offset;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                location.href = 'Rewards.html';
            }
            timeLeft--;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                pauseBtn.innerText = "繼續";
                pet.innerText = "💤"; 
            } else {
                startInterval();
                pauseBtn.innerText = "暫停";
                pet.innerText = "🐱";
            }
            isRunning = !isRunning;
        }

        function startInterval() {
            timerInterval = setInterval(updateTimer, 1000);
        }

        startInterval();
    </script>
</body>
</html>
