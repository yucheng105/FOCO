<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCO - Mission List</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --accent-color: #a29bfe;
        }

        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Navigation */
        .nav-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1px solid #eee;
        }

        .menu-icon { font-size: 1.5rem; cursor: pointer; margin-right: 15px; }
        .page-title { font-size: 1.2rem; font-weight: bold; flex-grow: 1; }

        /* Search & Filter Section */
        .filter-section {
            padding: 15px 20px;
            background: var(--card-bg);
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 1rem;
            background: #f1f2f6;
        }

        .tool-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sort-select {
            padding: 5px 10px;
            border: 1px solid #dfe6e9;
            border-radius: 5px;
            color: #636e72;
        }

        /* Mission List Area */
        .mission-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .mission-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .mission-item:active { transform: scale(0.98); }

        .mission-info h4 { margin: 0; font-size: 1rem; }
        .mission-info p { margin: 5px 0 0; font-size: 0.8rem; color: #b2bec3; }

        /* Floating Action Button (Add) */
        .fab-add {
            position: fixed;
            right: 20px;
            bottom: 30px;
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <div class="menu-icon">☰</div>
        <div class="page-title">任務清單</div>
    </div>

    <div class="filter-section">
        <input type="text" class="search-bar" placeholder="搜尋任務...">
        <div class="tool-row">
            <select class="sort-select">
                <option>排序方式：最新日期</option>
                <option>排序方式：專注時長</option>
            </select>
        </div>
    </div>

    <div class="mission-container" id="mission-list">
        <div class="mission-item" onclick="selectMission('撰寫資管專案報告')">
            <div class="mission-info">
                <h4>撰寫資管專案報告</h4>
                <p>上次專注：2 小時前</p>
            </div>
            <span>⏱️ 25m</span>
        </div>

        <div class="mission-item" onclick="selectMission('練習吉他音階')">
            <div class="mission-info">
                <h4>練習吉他音階</h4>
                <p>上次專注：昨天</p>
            </div>
            <span>⏱️ 40m</span>
        </div>
    </div>

    <button class="fab-add" onclick="addNewMission()">+</button>

    <script>
        function selectMission(title) {
            alert('已選擇任務：' + title + '\n接下來進入計時設定頁面');
            // 實作導向計時設定邏輯
        }

        function addNewMission() {
            const title = prompt("輸入新任務名稱：");
            if (title) {
                const list = document.getElementById('mission-list');
                const newItem = document.createElement('div');
                newItem.className = 'mission-item';
                newItem.onclick = () => selectMission(title);
                newItem.innerHTML = `
                    <div class="mission-info">
                        <h4>${title}</h4>
                        <p>新建立的任務</p>
                    </div>
                    <span>⏱️ --</span>
                `;
                list.prepend(newItem);
            }
        }
    </script>
</body>
</html>
